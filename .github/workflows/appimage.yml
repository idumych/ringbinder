name: appimage

# Ringbinder for x86_64 Linux desktops, as an AppImage, built against
# Cosmoe's prebuilt release packages. Those are built for Ubuntu 26.04, so
# this builds in an Ubuntu 26.04 container and the AppImage needs glibc 2.43
# or newer. Run it by hand, or push a v* tag to attach the AppImage to that
# release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file git zstd xz-utils \
            libcurl4-openssl-dev desktop-file-utils

      - uses: actions/checkout@v4

      - name: Install Cosmoe's packages (for their dependencies)
        run: |
          tag=$(sed -n 's/^COSMOE_TAG=//p' packaging/appimage/build-appimage.sh)
          ver="${tag#v}"; ver="${ver%_*}-1.${ver#*_}"
          for pkg in cosmoe cosmoe-dev; do
            curl -fsSLO "https://github.com/haydentech/cosmoe/releases/download/$tag/${pkg}_${ver}_amd64.deb"
          done
          apt-get install -y ./cosmoe_*.deb ./cosmoe-dev_*.deb
          rm -f ./*.deb

      - name: Build AppImage
        run: sh packaging/appimage/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Ringbinder-AppImage
          path: Ringbinder-*.AppImage

  attach:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: appimage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Ringbinder-AppImage
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Keep an AppImage that is already attached (the tested build that
        # SHA256SUMS describes); only add one if the release has none.
        run: |
          if gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep -q '\.AppImage$'; then
            echo "Release already has an AppImage; leaving it."
          else
            gh release upload "${GITHUB_REF_NAME}" Ringbinder-*.AppImage
          fi
